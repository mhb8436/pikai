# web(Next.js) → Azure App Service
# Next standalone 이라 be.yml 보다 단순합니다.

name: Deploy Web to Azure

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/common/**"
      # - "pnpm-lock.yaml"
      - ".github/workflows/fe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* 는 빌드 시 번들에 들어감
      - name: Build
        run: pnpm build:web
        env:
          NEXT_PUBLIC_BACK_URL: ${{ secrets.NEXT_PUBLIC_BACK_URL }}
          NEXT_PUBLIC_IMAGE_URL: ${{ secrets.NEXT_PUBLIC_IMAGE_URL }}
          NEXT_PUBLIC_FRONT_URL: ${{ secrets.NEXT_PUBLIC_FRONT_URL }}

      - name: Pack standalone
        run: |
          mkdir -p deploy-out
          cp -r apps/web/.next/standalone/. deploy-out/
          mkdir -p deploy-out/apps/web/.next
          cp -r apps/web/.next/static deploy-out/apps/web/.next/static
          cp -r apps/web/public deploy-out/apps/web/public
          cp apps/web/start.sh deploy-out/start.sh
          chmod +x deploy-out/start.sh

          # Azure OneDeploy가 node_modules 를 tar로 망가뜨리지 않게 이름 변경 (be.yml 과 동일)
          mv deploy-out/node_modules deploy-out/node_modules_app

          cd deploy-out
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' > .deployment
          rm -f node_modules.tar.gz app-node_modules.tar.gz pnpm-lock.yaml

          test -f apps/web/server.js
          test -d node_modules_app/.pnpm/node_modules/@swc/helpers
          echo "Artifact contents:"
          ls -la
          ls node_modules_app/.pnpm/node_modules/@swc/helpers

      - name: Zip
        run: cd deploy-out && zip -qr "$GITHUB_WORKSPACE/release-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: release-web.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-app

      - uses: azure/webapps-deploy@v3
        with:
          # 본인 App Service 이름으로 바꾸세요
          app-name: "pikai-web"
          package: release-web.zip
          publish-profile: ${{ secrets.FE_PUBLISH_PROFILE }}
