# API(Nest.js)만 빌드해서 Azure App Service(pikai)에 배포합니다.
# web은 이 파일에서 다루지 않습니다.

name: Deploy API to Azure

on:
  # main에 api 관련 파일이 바뀔 때만 실행
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/common/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/be.yml"
  # GitHub Actions 탭에서 수동 실행도 가능
  workflow_dispatch:

jobs:
  # --------------------------------------------------
  # 1) 빌드: 모노레포에서 api만 빌드 → Azure용 zip 만들기
  # --------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      # 모노레포 전체 의존성 설치 (빌드에 필요)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client 생성 (빌드/실행에 필요)
      # Secret은 등록만으로는 안 쓰임 → 여기서 명시적으로 env에 연결해야 함
      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # api와 api가 의존하는 패키지만 빌드 (web은 제외)
      - name: Build API
        run: pnpm build:api

      # Azure에는 모노레포 전체가 아니라 "실행에 필요한 것만" 올립니다.
      # 1. dist          → 빌드 결과
      # 2. prisma        → 배포 환경에서 client 재생성용
      # 3. package.deploy.json → workspace:* 없는 배포용 package.json
      # 4. prod 의존성 설치 + prisma generate
      - name: Create deployment folder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p deploy-out
          cp -r apps/api/dist deploy-out/dist
          cp -r apps/api/prisma deploy-out/prisma
          cp apps/api/prisma.config.ts deploy-out/prisma.config.ts
          cp apps/api/package.deploy.json deploy-out/package.json

          cd deploy-out
          pnpm install --prod --ignore-workspace --node-linker=hoisted --no-frozen-lockfile
          pnpm add prisma@6 --ignore-workspace --node-linker=hoisted
          pnpm exec prisma generate

      - name: Zip for Azure
        run: cd deploy-out && zip -qr "$GITHUB_WORKSPACE/release.zip" .

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: release.zip

  # --------------------------------------------------
  # 2) 배포: zip을 Azure App Service에 업로드
  # --------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download zip
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "pikai3"
          package: release.zip
          # GitHub Secret에 Publish Profile 전체 내용을 넣어둔 값
          publish-profile: ${{ secrets.BE_PUBLISH_PROFILE }}
