# API(Nest.js)만 빌드해서 Azure App Service(pikai)에 배포합니다.
# web은 이 파일에서 다루지 않습니다.

name: Deploy API to Azure

on:
  # main에 api 관련 파일이 바뀔 때만 실행
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/common/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/be.yml"
  # GitHub Actions 탭에서 수동 실행도 가능
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build API
        run: pnpm build:api

      - name: Create deployment folder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p deploy-out
          cp -r apps/api/dist deploy-out/dist
          cp -r apps/api/prisma deploy-out/prisma
          cp apps/api/prisma.config.ts deploy-out/prisma.config.ts
          cp apps/api/package.deploy.json deploy-out/package.json
          cp apps/api/start.sh deploy-out/start.sh
          chmod +x deploy-out/start.sh

          cd deploy-out
          npm install --omit=dev
          npx prisma generate

          # 의존성 검증
          test -f node_modules/@nestjs/core/package.json
          test -f node_modules/@nestjs/common/package.json
          test -f node_modules/@nestjs/platform-express/package.json
          test -f node_modules/prisma/package.json
          test -f node_modules/prisma/build/index.js
          test -f node_modules/tslib/package.json

          # @repo/common (workspace) — Azure zip에는 workspace가 없으므로 JS로 번들해 포함
          mkdir -p node_modules/@repo/common
          npx --yes esbuild "$GITHUB_WORKSPACE/packages/common/src/index.ts" \
            --bundle --platform=node --format=cjs \
            --outfile=node_modules/@repo/common/index.js
          printf '%s\n' '{' \
            '  "name": "@repo/common",' \
            '  "version": "0.0.0",' \
            '  "main": "index.js"' \
            '}' > node_modules/@repo/common/package.json
          test -f node_modules/@repo/common/index.js

          # .bin/prisma 가 wasm 을 .bin/ 에서 찾음 → 미리 복사
          cp -f node_modules/prisma/build/*.wasm node_modules/.bin/ 2>/dev/null || true

          # Azure OneDeploy가 node_modules 를 tar로 망가뜨리지 않게 이름 변경
          mv node_modules node_modules_app

          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' > .deployment
          rm -f pnpm-lock.yaml node_modules.tar.gz app-node_modules.tar.gz

          echo "Artifact contents:"
          ls -la
          ls node_modules_app/@nestjs

      - name: Zip for Azure
        run: cd deploy-out && zip -qr "$GITHUB_WORKSPACE/release.zip" .

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download zip
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "pikai3"
          package: release.zip
          # GitHub Secret에 Publish Profile 전체 내용을 넣어둔 값
          publish-profile: ${{ secrets.BE_PUBLISH_PROFILE }}
